name: Production Geoapify smoke

on:
  repository_dispatch:
    types: [vercel.deployment.ready]

permissions:
  contents: read

jobs:
  geoapify-smoke:
    # Vercel's GitHub integration dispatches this only after a deployment is
    # ready. Keep it production-only and scoped to the owner app project.
    if: >-
      github.event.client_payload.environment == 'production' &&
      github.event.client_payload.project.name == 'vehicle-os-web'
    runs-on: ubuntu-latest
    # This is the existing GitHub Environment attached to the vehicle-os-web
    # Vercel project. It is intentionally distinct from the generic Production
    # environment so this job receives its project-scoped smoke token.
    environment: Production – vehicle-os-web
    steps:
      - name: Check deployed Geoapify integration
        env:
          DEPLOYMENT_URL: ${{ github.event.client_payload.url }}
          DEPLOYMENT_SMOKE_TOKEN: ${{ secrets.DEPLOYMENT_SMOKE_TOKEN }}
        run: |
          if [ -z "$DEPLOYMENT_SMOKE_TOKEN" ]; then
            echo "DEPLOYMENT_SMOKE_TOKEN is not configured in the GitHub Production – vehicle-os-web environment."
            exit 1
          fi

          case "$DEPLOYMENT_URL" in
            https://vehicle-os-*.vercel.app) ;;
            *)
              echo "Unexpected Vercel deployment URL; refusing to send the smoke token."
              exit 1
              ;;
          esac

          curl --fail-with-body --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 10 --max-time 20 \
            --header "Authorization: Bearer $DEPLOYMENT_SMOKE_TOKEN" \
            "$DEPLOYMENT_URL/api/internal/geoapify-smoke"
